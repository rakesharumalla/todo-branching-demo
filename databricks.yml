bundle:
  name: todo-branching-demo

variables:
  lakebase_project_id:
    default: todo-branching-demo
  lakebase_branch:
    default: production
  lakebase_database_id:
    default: databricks-postgres

include:
  - resources/*.yml

# Keep local-only artifacts out of the app source that gets synced/deployed.
sync:
  exclude:
    - ".env"
    - ".env.*"
    - ".venv/**"
    - "docs/**"
    - "tests/**"
    - ".pytest_cache/**"
    - ".ruff_cache/**"
    - "__pycache__/**"

targets:
  prod:
    mode: production
    default: true
    workspace:
      # host is taken from your Databricks CLI profile (--profile / DATABRICKS_CONFIG_PROFILE).
      # host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
