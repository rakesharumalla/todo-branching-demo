resources:
  apps:
    todo_app:
      name: todo-branching-demo
      description: "Lakebase git-branching demo — Streamlit todo app on the production branch"
      source_code_path: ../
      resources:
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}
            database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE
